{% extends "base.html" %}
{% block title %}Your tasks{% endblock %}
{% block content %}
  <h1>Your tasks</h1>

  <form method="post" class="card add" action="{{ url_for('add_todo') }}">
    <label>
      New task
      <input type="text" name="title" placeholder="What needs doing?" required />
    </label>
    <button type="submit">Add</button>
  </form>

  {% if todos %}
    <ul class="todos">
      {% for todo in todos %}
        <li class="{% if todo.done %}done{% endif %}">
          <form method="post" action="{{ url_for('toggle_todo', todo_id=todo.id) }}">
            <button type="submit" class="check" aria-label="Toggle complete">
              {% if todo.done %}✓{% else %}○{% endif %}
            </button>
          </form>
          <span class="title">{{ todo.title }}</span>
          <form method="post" action="{{ url_for('delete_todo', todo_id=todo.id) }}">
            <button type="submit" class="danger" aria-label="Delete task">Delete</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="muted">No tasks yet. Add one above.</p>
  {% endif %}
{% endblock %}
